<!DOCTYPE html>
<html lang="en">
<head>

  <title>Help for the boys</title>
  <style>
    *{
      margin: 0;

    <span style="top: -30px;left: -20px;">OPT D<br /><span style="left: 50px">21.2%</span></span>

  <h2 style="text-align: center;margin: -50px 0 0 0;">34.2 + 28.9 = 63.1% ~ 70%, <br /> Yani sir sach bol rahe hai</h2>

</html>
